name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04
    name: ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    continue-on-error: ${{ matrix.experimental || false }}

    # The database versions satisfy the minimum of every Moodle branch of the matrix
    # (Moodle 5.3 needs PostgreSQL 17 and MariaDB 11.4).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    # Every Moodle version still supported upstream, with its lowest and highest supported PHP version,
    # plus the development branch as an early warning that is allowed to fail.
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: 'MOODLE_405_STABLE'
            php: '8.1'
            database: pgsql
          - moodle-branch: 'MOODLE_405_STABLE'
            php: '8.3'
            database: mariadb
          - moodle-branch: 'MOODLE_501_STABLE'
            php: '8.2'
            database: mariadb
          - moodle-branch: 'MOODLE_501_STABLE'
            php: '8.4'
            database: pgsql
          - moodle-branch: 'MOODLE_502_STABLE'
            php: '8.3'
            database: pgsql
          - moodle-branch: 'MOODLE_502_STABLE'
            php: '8.4'
            database: mariadb
          - moodle-branch: 'MOODLE_503_STABLE'
            php: '8.3'
            database: mariadb
          - moodle-branch: 'MOODLE_503_STABLE'
            php: '8.4'
            database: pgsql
          - moodle-branch: 'main'
            php: '8.4'
            database: pgsql
            experimental: true

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
